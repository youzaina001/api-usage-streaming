name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.24"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy src tests
      - name: Unit tests
        run: uv run --locked pytest -q --ignore=tests/integration

  integration:
    name: Integration tests (Kafka and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Start Kafka and PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120
      - name: Wait for Kafka to accept requests
        # compose.yaml has a healthcheck for PostgreSQL only, so --wait does not cover the broker.
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server 127.0.0.1:19092 > /dev/null 2>&1; then
              echo "Kafka ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Kafka did not accept requests within 60 seconds" >&2
          exit 1
      - name: Integration tests
        env:
          USAGE_TEST_INTEGRATION: "1"
        run: uv run --locked pytest -q
      - name: Dump Compose logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --timestamps
      - name: Stop stack
        if: always()
        run: docker compose down -v
