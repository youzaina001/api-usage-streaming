[project]
name = "api-usage-streaming"
version = "0.1.0"
description = "Local Kafka and PostgreSQL API usage reconciliation"
requires-python = ">=3.12,<3.13"
dependencies = ["confluent-kafka>=2.12,<3", "psycopg[binary]>=3.2,<4"]

[project.scripts]
usage-stream = "usage_stream.cli:main"

[dependency-groups]
dev = ["mypy>=1.15,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_stream"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
